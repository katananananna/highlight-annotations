name: Check and attach plugin assets

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: main.js is valid and complete
        run: |
          node --check main.js
          grep -q "module.exports" main.js || { echo "main.js has no module.exports - plugin would not load"; exit 1; }
          size=$(wc -c < main.js); [ "$size" -gt 5000 ] || { echo "main.js is only $size bytes - looks truncated"; exit 1; }
      - name: Release tag matches manifest version
        if: github.event_name == 'release'
        run: |
          v=$(node -p "require('./manifest.json').version")
          [ "$v" = "${{ github.event.release.tag_name }}" ] || { echo "tag ${{ github.event.release.tag_name }} != manifest $v"; exit 1; }
          node -e "const v=require('./versions.json'); if(!v['$v']) { console.error('versions.json missing $v'); process.exit(1) }"

  attach:
    needs: check
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload main.js, manifest.json, styles.css
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
